name: Deploy API Ragil

on:
  push:
    branches:
      - dev

jobs:
  lint:
    name: Golang Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25.3

      - name: Linting Code
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  test:
    name: Golang Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25.3

      - name: Run Tests
        run: go test ./... -v -cover